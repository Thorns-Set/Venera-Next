name: 转存 Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 构建运行的 ID
        required: true
        default: "43393562994"

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: 下载产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" -n apk -D dl
          ls -l dl
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view patched-v3 >/dev/null 2>&1 || gh release create patched-v3 --title "patched-v3" --notes "VeneraNext arm64 debug 包"
          gh release upload patched-v3 dl/*arm64*.apk --clobber
