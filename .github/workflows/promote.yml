name: 转存 Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 构建运行的 ID
        required: true
        default: "43393562994"

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: 下载产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" -n apk -D dl
          ls -l dl
      - name: 上传到临时网盘
        run: |
          set -euo pipefail
          f=$(ls dl/*arm64*.apk | head -1)
          echo "上传 $f"
          url=$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64)" --max-time 1200 -F "reqtype=fileupload" -F "fileToUpload=@$f" https://catbox.moe/user/api.php)
          echo "URL: $url"
          echo "$url" > apk_url.txt
      - name: 记录链接
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apk_url.txt
          git commit -m "chore: 记录 APK 临时下载链接" || true
          git push || true
